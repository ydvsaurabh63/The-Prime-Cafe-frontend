<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>The Prime Cafe</title>
    <meta name="description" content="Artisanal Brews, Gourmet Eats & Seamless Online Ordering" />

    <!-- Open Graph & Social Sharing -->
    <meta property="og:title" content="The Prime Cafe" />
    <meta property="og:description" content="Artisanal Brews, Gourmet Eats & Seamless Online Ordering" />
    <meta property="og:image" content="https://the-prime-cafe-frontend.vercel.app/logo.png" />
    <meta property="og:url" content="https://the-prime-cafe-frontend.vercel.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Prime Cafe" />
    <meta name="twitter:description" content="Artisanal Brews, Gourmet Eats & Seamless Online Ordering" />
    <meta name="twitter:image" content="https://the-prime-cafe-frontend.vercel.app/logo.png" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#4A2C18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Prime Cafe" />

    <!-- Icons & Manifest with Cache Busting for Scanners & Google Lens -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=prime2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=prime2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=prime2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=prime2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=prime2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=prime2" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=prime2" />
    <link rel="apple-touch-startup-image" href="/pwa-512x512.png" />
    <link rel="manifest" href="/manifest.json?v=prime2" />

    <!-- Structured Data for Google Lens & Search Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CafeOrCoffeeShop",
      "name": "The Prime Cafe",
      "image": "https://the-prime-cafe-frontend.vercel.app/logo.png",
      "logo": "https://the-prime-cafe-frontend.vercel.app/logo.png",
      "url": "https://the-prime-cafe-frontend.vercel.app"
    }
    </script>
    <!-- Google Identity Services SDK for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root">
      <!-- Instant Native-like Branded Splash Screen -->
      <div id="prime-splash-loader" style="position:fixed;inset:0;background-color:#FAF7F2;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
          <div style="position:absolute;width:116px;height:116px;border-radius:50%;background:rgba(200,90,50,0.12);animation:splash-pulse 2s infinite ease-in-out;"></div>
          <div style="width:96px;height:96px;border-radius:50%;overflow:hidden;box-shadow:0 10px 25px rgba(44,24,16,0.16);border:2px solid rgba(200,90,50,0.35);background:#000;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;">
            <img src="/logo.png" alt="The Prime Cafe" style="width:100%;height:100%;object-fit:cover;display:block;" />
          </div>
        </div>
        <h1 style="font-size:20px;font-weight:800;color:#2C1810;margin:0 0 4px 0;letter-spacing:-0.02em;">The Prime Cafe</h1>
        <p style="font-size:11px;font-weight:700;color:#C85A32;margin:0;letter-spacing:0.08em;text-transform:uppercase;">Artisanal Roastery & Eatery</p>
        <div style="margin-top:24px;display:flex;align-items:center;gap:8px;">
          <div style="width:20px;height:20px;border:2.5px solid #E6DCD3;border-top-color:#C85A32;border-radius:50%;animation:splash-spin 0.8s linear infinite;"></div>
          <span style="font-size:11px;font-weight:600;color:#7A685D;letter-spacing:0.02em;">Brewing Experience...</span>
        </div>
        <style>
          @keyframes splash-spin { to { transform: rotate(360deg); } }
          @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 0.2; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
